version: "1.0.0"

state_types:
  AVAILABLE:
    freshness: { fresh_seconds: 900, stale_grace_seconds: 900, volatility: 0.65 }
    allowed_value_kinds: [boolean, quantity, categorical]
    material_equivalence_seconds: 300
    contradiction_minimum_confidence: 0.62
    verification:
      threshold: 0.74
      min_independent_origins: 1
      allowed_epistemic_statuses: [DECLARED, OBSERVED, SYSTEM_REPORTED, TRANSACTION_EVIDENCED]
      reject_inference_only: true

  ACCESSIBLE:
    freshness: { fresh_seconds: 600, stale_grace_seconds: 600, volatility: 0.75 }
    allowed_value_kinds: [boolean, categorical]
    material_equivalence_seconds: 240
    contradiction_minimum_confidence: 0.64
    verification:
      threshold: 0.76
      min_independent_origins: 1
      allowed_epistemic_statuses: [DECLARED, OBSERVED, SYSTEM_REPORTED, TRANSACTION_EVIDENCED]
      reject_inference_only: true

  WORKING:
    freshness: { fresh_seconds: 1200, stale_grace_seconds: 1200, volatility: 0.55 }
    allowed_value_kinds: [boolean, categorical]
    material_equivalence_seconds: 300
    contradiction_minimum_confidence: 0.62
    verification:
      threshold: 0.75
      min_independent_origins: 1
      allowed_epistemic_statuses: [DECLARED, OBSERVED, SYSTEM_REPORTED, TRANSACTION_EVIDENCED]
      reject_inference_only: true

  TIME:
    freshness: { fresh_seconds: 300, stale_grace_seconds: 300, volatility: 0.90 }
    allowed_value_kinds: [duration, range]
    material_equivalence_seconds: 120
    contradiction_minimum_confidence: 0.60
    verification:
      threshold: 0.70
      min_independent_origins: 1
      allowed_epistemic_statuses: [OBSERVED, SYSTEM_REPORTED, TRANSACTION_EVIDENCED]
      reject_inference_only: true

  CHANGED:
    freshness: { fresh_seconds: 600, stale_grace_seconds: 300, volatility: 0.80 }
    allowed_value_kinds: [change, categorical]
    material_equivalence_seconds: 180
    contradiction_minimum_confidence: 0.61
    verification:
      threshold: 0.72
      min_independent_origins: 1
      allowed_epistemic_statuses: [DECLARED, OBSERVED, SYSTEM_REPORTED, TRANSACTION_EVIDENCED]
      reject_inference_only: true

confidence:
  weights:
    source_reliability: 0.28
    evidence_quality: 0.24
    corroboration: 0.18
    recency: 0.20
    location_quality: 0.10
  evidence_strengths:
    OWNER_DECLARATION: 0.76
    WITNESS_REPORT: 0.62
    INSTITUTIONAL_API: 0.90
    SYSTEM_EVENT: 0.88
    TRANSACTION_TRACE: 0.94
    SENSOR_READING: 0.88
    MEDIA: 0.72
    DOCUMENT: 0.70
  source_type_baselines:
    owner: 0.75
    witness: 0.55
    institutional_api: 0.90
    system: 0.88
    transaction: 0.95
    sensor: 0.85
  location_unknown_score: 0.25
  location_manual_score: 0.55
  location_gps_score: 0.90

decision_contexts:
  consumer_discovery:
    minimum_confidence: 0.50
    allow_stale_grace: true
    require_verified: false
  operational_coordination:
    minimum_confidence: 0.68
    allow_stale_grace: false
    require_verified: false
  consequential_action:
    minimum_confidence: 0.80
    allow_stale_grace: false
    require_verified: true

source_ranking:
  weights:
    reliability: 0.32
    authority: 0.22
    evidence_capability: 0.22
    latency: 0.14
    cost: 0.10
  maximum_cost_units: 100
  maximum_latency_ms: 30000

nearby_ranking:
  weights:
    proximity: 0.20
    intent_relevance: 0.12
    urgency: 0.10
    uncertainty_consequence: 0.10
    freshness: 0.12
    confidence: 0.12
    recent_change: 0.08
    active_demand: 0.08
    watch_relevance: 0.08
  default_radius_m: 5000
  maximum_radius_m: 50000

source_learning:
  prior_strength: 8.0
  minimum_reliability: 0.05
  maximum_reliability: 0.99
