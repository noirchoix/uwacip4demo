[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uwaci-pipe4"
version = "1.0.0"
description = "UWACI Pipe 4 production reference service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.40,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.45,<3",
  "asyncpg>=0.31,<1",
  "alembic>=1.17,<2",
  "geoalchemy2>=0.18,<1",
  "redis>=5,<6.5",
  "celery[redis]>=5.6,<6",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.22,<1",
  "httpx>=0.28,<1",
  "boto3>=1.42,<2",
  "PyYAML>=6,<7",
  "aiofiles>=25,<26",
  "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "testcontainers[postgres]>=4.13,<5",
  "ruff>=0.14,<1",
  "mypy>=1.19,<2",
  "pip-audit>=2.10,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "integration: requires external infrastructure",
  "performance: performance smoke test",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "geoalchemy2.*", "celery.*"]
ignore_missing_imports = true
