services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pipe4
      POSTGRES_USER: pipe4
      POSTGRES_PASSWORD: pipe4
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipe4 -d pipe4"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    ports:
      - "${PIPE4_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        attempt=0
        until alembic upgrade head; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo "Database migration failed after 30 attempts" >&2
            exit 1
          fi
          echo "Database migration attempt $$attempt failed; retrying in 2 seconds" >&2
          sleep 2
        done
        exec uvicorn pipe4.app:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "pipe4.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]

  beat:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "pipe4.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      PIPE4_API_ORIGIN: http://api:8000
      PIPE4_JWT_HS256_SECRET: ${PIPE4_JWT_HS256_SECRET:-dev-only-secret-change-me}
      PIPE4_WEB_DEV_MODE: "true"
      PIPE4_INTERNAL_API_TOKEN: ${PIPE4_INTERNAL_API_TOKEN:-}
    ports:
      - "${PIPE4_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PIPE4_GATEWAY_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
  redisdata:
